<!-- Floating Timer Popup (hidden by default) -->
<div id="timerPopup" class="hidden">
  <div class="timer-box">
    <div id="phase">Ready?</div>
    <div id="timer">1:00</div>

    <!-- Repeat Sound Toggle -->
    <div id="repeatContainer" style="margin: 10px;">
      <input type="checkbox" id="repeatSoundPopup" checked>
      <label for="repeatSound">🔁 Repeat Work/Rest Sound</label>
    </div>

    <div class="controls">
      <button id="pauseBtn">⏸ Pause</button>
      <button id="quitBtn">❌ Quit</button>
    </div>

    <audio id="workSound" src="../../timer_sounds/work_start.mp3"></audio>
    <audio id="restSound" src="../../timer_sounds/rest_start.mp3"></audio>
    <audio id="doneSound" src="../../timer_sounds/done.mp3"></audio>
  </div>
</div>
